<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello-world · AI Engineer Portfolio &amp; Dev Hub</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel-2: #171c29; --border: #232a3a;
    --text: #e6e9f0; --muted: #8f99ad; --faint: #5c6578;
    --accent: #6ea8fe; --accent-2: #a78bfa;
    --grad: linear-gradient(120deg, #6ea8fe, #a78bfa);
    --green: #3fb950; --red: #f85149; --blue: #58a6ff; --yellow: #d29922;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-gutter: stable; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  body::before { /* 상단 그라디언트 헤어라인 */
    content: ''; display: block; height: 3px; background: var(--grad);
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 40px 24px 96px; }
  a { color: var(--accent); }

  /* ── 히어로 ─────────────────────────────── */
  .hero { position: relative; padding: 8px 0 28px; }
  .hero-glow {
    position: absolute; inset: -80px -40px auto; height: 260px; pointer-events: none;
    background: radial-gradient(420px 200px at 18% 30%, rgba(110,168,254,.14), transparent 70%),
                radial-gradient(360px 180px at 60% 10%, rgba(167,139,250,.10), transparent 70%);
  }
  .hero-top { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero h1 {
    font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.15;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .tagline { margin-top: 6px; font-size: 1.02rem; color: var(--muted); font-weight: 500; }
  .gh-link {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
    padding: 9px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text); text-decoration: none; font-size: .88rem; font-weight: 600;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .gh-link:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .gh-link svg { fill: currentColor; }
  .hero-meta { position: relative; margin-top: 14px; color: var(--faint); font-size: .84rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hero-meta code { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; font-size: .82em; }
  .hero-meta .dot { color: var(--border); }
  #last-active { color: var(--muted); font-weight: 600; }

  /* ── 통계 카드 ──────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 10px 0 34px; }
  .stat {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .stat:hover { border-color: #34405c; transform: translateY(-2px); box-shadow: var(--shadow); }
  .stat .ico {
    width: 42px; height: 42px; border-radius: 11px; flex: none;
    display: grid; place-items: center; font-size: 1.15rem;
  }
  .stat b { font-size: 1.55rem; font-weight: 750; display: block; line-height: 1.2; letter-spacing: -.01em; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .ico-total { background: rgba(110,168,254,.13); }
  .ico-done  { background: rgba(63,185,80,.13); }
  .ico-drop  { background: rgba(248,81,73,.12); }
  .ico-run   { background: rgba(210,153,34,.13); }

  /* ── 레이아웃 ───────────────────────────── */
  .grid { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 26px; align-items: start; }
  .side { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 20px; }
  h2 { font-size: 1.02rem; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  h2 .bar-accent { width: 4px; height: 16px; border-radius: 2px; background: var(--grad); display: inline-block; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .card h2 { margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: .86rem; }

  /* ── 검색 + 필터 ────────────────────────── */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 20px; }
  #search {
    flex: 1 1 200px; min-width: 160px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 9px 14px; font-size: .88rem; font-family: inherit; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  #search::placeholder { color: var(--faint); }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,168,254,.15); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 15px; cursor: pointer; font-size: .83rem; font-weight: 600; font-family: inherit;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--grad); border-color: transparent; color: #0b0e14; }

  /* ── 타임라인 ───────────────────────────── */
  .tl-group { position: relative; padding-left: 26px; margin-bottom: 26px; }
  .tl-group::before { /* 세로 라인 */
    content: ''; position: absolute; left: 7px; top: 8px; bottom: -18px; width: 2px;
    background: linear-gradient(var(--border), transparent);
  }
  .tl-group:last-child::before { bottom: 12px; }
  .tl-date { position: relative; font-size: .86rem; font-weight: 700; color: var(--muted); margin-bottom: 12px; letter-spacing: .02em; }
  .tl-dot {
    position: absolute; left: -26px; top: 6px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(110,168,254,.12);
  }
  .tl-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 12px;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .tl-card:hover { border-color: #34405c; transform: translateY(-2px); box-shadow: var(--shadow); }
  .tl-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .tl-head h3 { font-size: .98rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.45; }
  .tl-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 9px; font-size: .76rem; color: var(--muted); font-weight: 600;
  }
  .tl-tags .commit { font-size: .8rem; color: var(--faint); }
  .tl-sum { margin-top: 9px; font-size: .87rem; color: var(--muted); }
  .tl-sum b { color: var(--text); }
  code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: .84em; }
  .badge { border-radius: 12px; padding: 2px 11px; font-size: .78rem; font-weight: 600; white-space: nowrap; flex: none; }
  .b-done { background: rgba(63,185,80,.14); color: var(--green); }
  .b-drop { background: rgba(248,81,73,.14); color: var(--red); }
  .b-run  { background: rgba(88,166,255,.14); color: var(--blue); }
  .b-etc  { background: rgba(210,153,34,.14); color: var(--yellow); }
  .empty { color: var(--faint); font-size: .88rem; padding: 18px 4px; }

  /* ── 미니 바차트 ────────────────────────── */
  #chart svg { width: 100%; height: auto; max-height: 170px; display: block; }
  #chart .bar { fill: var(--accent); opacity: .88; transition: opacity .15s; }
  #chart .bar:hover { opacity: 1; }
  #chart .stub { fill: var(--border); }
  #chart .axis { stroke: var(--border); stroke-width: 1; }
  #chart .val { fill: var(--text); font-size: 10px; font-weight: 600; text-anchor: middle; }
  #chart .lbl { fill: var(--muted); font-size: 10px; text-anchor: middle; }

  /* ── 문서 목록 ──────────────────────────── */
  .docs { display: flex; flex-direction: column; gap: 8px; }
  .docs button {
    display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; font-size: .86rem; font-family: inherit;
    transition: border-color .15s, transform .15s;
  }
  .docs button:hover { border-color: var(--accent); transform: translateX(2px); }

  /* ── 문서 오버레이 ──────────────────────── */
  #overlay { position: fixed; inset: 0; z-index: 50; }
  #overlay[hidden] { display: none; }
  .ov-backdrop { position: absolute; inset: 0; background: rgba(4,6,10,.66); backdrop-filter: blur(3px); }
  .ov-panel {
    position: absolute; inset: 4vh 0 4vh 50%; transform: translateX(-50%);
    width: min(860px, 94vw); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,.55); overflow: hidden;
    animation: ov-in .18s ease-out;
  }
  @keyframes ov-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  .ov-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
    padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .ov-head b { font-size: .92rem; }
  #ov-close {
    background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
    width: 30px; height: 30px; cursor: pointer; font-size: .95rem; line-height: 1;
    transition: border-color .15s, color .15s;
  }
  #ov-close:hover { border-color: var(--red); color: var(--red); }
  #viewer { overflow-y: auto; padding: 24px 30px 40px; }
  #viewer h1 { font-size: 1.4rem; margin: 18px 0 10px; }
  #viewer h2 { font-size: 1.15rem; margin: 18px 0 8px; display: block; }
  #viewer h3 { font-size: 1rem; margin: 14px 0 6px; }
  #viewer h4 { font-size: .92rem; margin: 12px 0 6px; }
  #viewer h1:first-child, #viewer h2:first-child { margin-top: 0; }
  #viewer p { margin: 8px 0; font-size: .9rem; }
  #viewer pre { background: #0d1117; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: .84rem; margin: 12px 0; }
  #viewer pre code { border: none; padding: 0; background: none; }
  #viewer table { margin: 12px 0; width: 100%; border-collapse: collapse; font-size: .85rem; }
  #viewer th, #viewer td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #viewer th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  #viewer blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; color: var(--muted); margin: 10px 0; }
  #viewer ul, #viewer ol { padding-left: 26px; margin: 8px 0; font-size: .9rem; }
  #viewer li { margin: 3px 0; }
  #viewer hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  .err { color: var(--red); background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.25); border-radius: 10px; padding: 12px 16px; font-size: .88rem; }

  /* ── 반응형 ─────────────────────────────── */
  @media (max-width: 768px) {
    .wrap { padding: 28px 16px 72px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .side { position: static; }
    .ov-panel { inset: 3vh 3vw; transform: none; width: auto; }
    @keyframes ov-in { from { opacity: 0; transform: translateY(10px); } }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-glow"></div>
    <div class="hero-top">
      <div>
        <h1>Hello-world</h1>
        <p class="tagline">AI Engineer Portfolio &amp; Dev Hub</p>
      </div>
      <a class="gh-link" href="https://github.com/junki7853/Hello-world" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </div>
    <p class="hero-meta">
      로컬 전용 대시보드 <span class="dot">·</span> 데이터 원본 <code>docs/WORKLOG.md</code>
      <span class="dot">·</span> <span id="last-active"></span>
    </p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <main>
      <h2><span class="bar-accent"></span>작업 타임라인</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="작업명·요약·커밋 검색…" autocomplete="off">
        <div class="filters" id="filters"></div>
      </div>
      <div id="timeline"></div>
    </main>

    <aside class="side">
      <div class="card">
        <h2><span class="bar-accent"></span>월별 작업 수</h2>
        <div id="chart"></div>
      </div>
      <div class="card">
        <h2><span class="bar-accent"></span>기술 문서</h2>
        <div class="docs" id="docs"></div>
      </div>
    </aside>
  </div>
</div>

<div id="overlay" hidden>
  <div class="ov-backdrop" id="ov-backdrop"></div>
  <div class="ov-panel" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="ov-head"><b id="ov-title"></b><button id="ov-close" aria-label="닫기">✕</button></div>
    <div id="viewer"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let rows = [], filter = '전체', query = '', loadFailed = false;

// ── XSS 가드 (불변 계약: 따옴표까지 이스케이프, 링크는 https/상대경로/#만 허용) ──
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
      /^(https?:|\.?\/|#)/i.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
}

// ── WORKLOG 파싱 (불변 계약: 첫 번째 연속 표 블록만, 6열, 구분선 행 제외) ──
const isSepRow = l => l.split('|').slice(1, -1).every(c => /^:?-+:?$/.test(c.trim()));

function parseWorklog(md) {
  // 첫 번째 연속된 표 블록만 파싱 (이후 표·코드펜스 내 파이프 줄 오염 방지)
  const lines = md.split('\n');
  const start = lines.findIndex(l => l.trim().startsWith('|'));
  if (start < 0) return [];
  const block = [];
  for (let i = start; i < lines.length && lines[i].trim().startsWith('|'); i++) block.push(lines[i]);
  return block.slice(1).filter(l => !isSepRow(l))
              .map(l => l.split('|').slice(1, -1).map(c => c.trim()))
              .filter(c => c.length >= 6);
}

function badge(status) {
  const cls = status.includes('완료') ? 'b-done' : status.includes('파기') ? 'b-drop'
            : status.includes('진행') ? 'b-run' : 'b-etc';
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

// ── 통계 카드 ──
function renderStats() {
  const n = k => rows.filter(r => r[3].includes(k)).length;
  $('stats').innerHTML = [
    ['📦', 'ico-total', rows.length, '총 작업'],
    ['✅', 'ico-done',  n('완료'),   '완료'],
    ['🗑️', 'ico-drop',  n('파기'),   '파기'],
    ['⚡', 'ico-run',   n('진행'),   '진행중']
  ].map(([ico, cls, v, l]) =>
    `<div class="stat"><span class="ico ${cls}">${ico}</span><div><b>${v}</b><span>${l}</span></div></div>`).join('');
}

// ── 필터 칩 + 검색 ──
function renderFilters() {
  const opts = ['전체', '완료', '파기', '진행'];
  const box = $('filters');
  box.textContent = '';
  for (const o of opts) {
    const b = document.createElement('button');
    b.className = 'chip' + (o === filter ? ' on' : '');
    b.textContent = o === '전체' ? `전체 ${rows.length}` : `${o} ${rows.filter(r => r[3].includes(o)).length}`;
    b.addEventListener('click', () => { filter = o; renderFilters(); renderTimeline(); });
    box.appendChild(b);
  }
}

// ── 타임라인 (날짜 그룹핑 카드 뷰) ──
function renderTimeline() {
  if (loadFailed) return; // 로드 실패 문구를 검색/필터가 덮어쓰지 않도록
  const q = query.trim().toLowerCase();
  const shown = rows.filter(r =>
    (filter === '전체' || r[3].includes(filter)) &&
    (!q || r.join(' ').toLowerCase().includes(q)));
  if (!shown.length) { $('timeline').innerHTML = '<p class="empty">조건에 맞는 작업이 없습니다.</p>'; return; }
  const groups = [];
  for (const r of shown) {
    const g = groups[groups.length - 1];
    if (g && g.date === r[0]) g.items.push(r); else groups.push({ date: r[0], items: [r] });
  }
  $('timeline').innerHTML = groups.map(g => `
    <section class="tl-group">
      <div class="tl-date"><span class="tl-dot"></span>${esc(g.date)}</div>
      ${g.items.map(r => `
        <article class="tl-card">
          <div class="tl-head"><h3>${esc(r[1])}</h3>${badge(r[3])}</div>
          <div class="tl-tags"><span class="tag">${esc(r[2])}</span><span class="commit">${inline(r[5])}</span></div>
          <p class="tl-sum">${inline(r[4])}</p>
        </article>`).join('')}
    </section>`).join('');
}

// ── 월별 작업 수 미니 바차트 (바닐라 SVG) ──
function monthCounts() {
  const c = new Map();
  for (const r of rows) {
    const m = (r[0] || '').match(/^(\d{4})-(\d{2})/);
    if (m) { const k = m[1] + '-' + m[2]; c.set(k, (c.get(k) || 0) + 1); }
  }
  if (!c.size) return [];
  const keys = [...c.keys()].sort();
  const [sy, sm] = keys[0].split('-').map(Number);
  // 마지막 기록 이후의 공백도 보이도록 오늘 달까지 채운다 (미래 기록이 있으면 그쪽 우선)
  const now = new Date();
  const [ey, em] = [keys[keys.length - 1], now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')]
    .sort().pop().split('-').map(Number);
  const out = [];
  for (let y = sy, m = sm; y < ey || (y === ey && m <= em); m === 12 ? (y++, m = 1) : m++)
    out.push({ key: y + '-' + String(m).padStart(2, '0'), y, m, n: c.get(y + '-' + String(m).padStart(2, '0')) || 0 });
  return out.slice(-12); // 오늘 기준 최근 12개월
}

function renderChart() {
  const data = monthCounts();
  if (!data.length) { $('chart').innerHTML = '<p class="muted">데이터 없음</p>'; return; }
  const max = Math.max(...data.map(d => d.n), 1);
  // viewBox 폭 고정: 월 수가 적어도 CSS 확대가 일어나지 않도록 남는 폭은 여백으로 흡수
  const W = 312, padL = 6, padR = 6, padT = 20, padB = 22, H = 148;
  const slotW = Math.min(60, (W - padL - padR) / data.length);
  const offX = padL + (W - padL - padR - slotW * data.length) / 2; // 슬롯 묶음 가운데 정렬
  const plotH = H - padT - padB, baseY = H - padB;
  const barW = Math.min(24, slotW - 10);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 작업 수">`;
  svg += `<line class="axis" x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}"/>`;
  data.forEach((d, i) => {
    const x = offX + i * slotW + (slotW - barW) / 2;
    const cx = x + barW / 2;
    if (d.n) {
      const h = Math.max(4, Math.round(plotH * d.n / max));
      const y = baseY - h;
      const r = Math.min(4, h, barW / 2); // 상단만 4px 라운드, 베이스라인은 직각
      svg += `<path class="bar" d="M${x},${baseY} V${y + r} Q${x},${y} ${x + r},${y} H${x + barW - r} Q${x + barW},${y} ${x + barW},${y + r} V${baseY} Z"><title>${d.key} · ${d.n}건</title></path>`;
      svg += `<text class="val" x="${cx}" y="${y - 6}">${d.n}</text>`;
    } else {
      svg += `<rect class="stub" x="${x}" y="${baseY - 2}" width="${barW}" height="2"><title>${d.key} · 0건</title></rect>`;
    }
    const lbl = (i === 0 || d.m === 1) ? `${String(d.y).slice(2)}.${d.m}` : `${d.m}월`;
    svg += `<text class="lbl" x="${cx}" y="${H - 6}">${lbl}</text>`;
  });
  $('chart').innerHTML = svg + '</svg>';
}

// ── 경량 마크다운 렌더러 (문서 뷰어용) ──
function renderMd(md) {
  const out = []; let inCode = false, buf = [];
  const flushTable = tbl => {
    if (!tbl.length) return;
    out.push('<table>' + tbl.filter(l => !isSepRow(l)).map((l, i) =>
      '<tr>' + l.split('|').slice(1, -1).map(c => `<${i ? 'td' : 'th'}>${inline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>');
    tbl.length = 0;
  };
  const tbl = [];
  for (const line of md.split('\n')) {
    if (line.trim().startsWith('```')) {
      flushTable(tbl);
      if (inCode) { out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); buf = []; }
      inCode = !inCode; continue;
    }
    if (inCode) { buf.push(line); continue; }
    if (line.trim().startsWith('|')) { tbl.push(line); continue; }
    flushTable(tbl);
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); continue; }
    if (/^\s*>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/, ''))}</blockquote>`); continue; }
    if (/^\s*[-*]\s+/.test(line)) { out.push(`<ul><li>${inline(line.replace(/^\s*[-*]\s+/, ''))}</li></ul>`); continue; }
    if (/^\s*\d+\.\s+/.test(line)) { out.push(`<ol><li>${inline(line.replace(/^\s*\d+\.\s+/, ''))}</li></ol>`); continue; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (inCode && buf.length) out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); // 닫히지 않은 펜스 보존
  flushTable(tbl);
  // 연속된 li 묶음 정리
  return out.join('\n').replace(/<\/ul>\n<ul>/g, '').replace(/<\/ol>\n<ol>/g, '');
}

// ── 문서 오버레이 ──
async function openDoc(name) {
  const res = await fetch('/docs/' + encodeURIComponent(name));
  $('ov-title').textContent = name;
  $('viewer').innerHTML = res.ok ? renderMd(await res.text()) : `<p class="err">${esc(name)} 로드 실패</p>`;
  $('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  $('viewer').scrollTop = 0;
}

function closeDoc() {
  $('overlay').hidden = true;
  document.body.style.overflow = '';
}

async function loadDocs() {
  try {
    const res = await fetch('/docs/');
    if (!res.ok) throw new Error();
    const html = await res.text();
    const names = [...html.matchAll(/href="([^"]+\.md)"/g)].map(m => decodeURIComponent(m[1]));
    const box = $('docs');
    box.textContent = '';
    if (!names.length) { box.innerHTML = '<p class="err">문서 없음</p>'; return; }
    for (const n of names) {
      const b = document.createElement('button');
      b.textContent = '📄 ' + n;
      b.addEventListener('click', () => openDoc(n));
      box.appendChild(b);
    }
  } catch { $('docs').innerHTML = '<p class="err">docs/ 목록을 불러올 수 없습니다.</p>'; }
}

// ── 초기화 ──
async function init() {
  $('ov-close').addEventListener('click', closeDoc);
  $('ov-backdrop').addEventListener('click', closeDoc);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden) closeDoc(); });
  $('search').addEventListener('input', e => { query = e.target.value; renderTimeline(); });
  try {
    const res = await fetch('/docs/WORKLOG.md');
    if (!res.ok) throw new Error('WORKLOG fetch failed: ' + res.status);
    rows = parseWorklog(await res.text()).reverse(); // 최신이 위로
    const latest = rows.map(r => r[0]).filter(d => /^\d{4}-\d{2}-\d{2}/.test(d)).sort().pop();
    $('last-active').textContent = latest ? `마지막 활동 ${latest}` : '';
    renderStats(); renderFilters(); renderTimeline(); renderChart();
  } catch {
    loadFailed = true;
    $('timeline').innerHTML = '<p class="err">WORKLOG.md를 불러올 수 없습니다. 서버를 레포 루트에서 실행했는지 확인하세요 (hub/serve.cmd 사용 권장).</p>';
  }
  loadDocs();
}
init();
